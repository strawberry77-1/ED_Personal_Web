<!-- ========== 主题预置（防首帧闪烁） ==========
     必须在样式表之前同步执行：若等到 body 末尾的 app.js 才切主题，偏好浅色的
     用户会先看到一帧暗色再跳亮（本地几十毫秒不易察觉，部署到网络后会很明显）。
     逻辑与 app.js 的 applyTheme() 同源 —— 键名 "edwards-site-theme" 与
     ?theme= 参数两处必须同步修改。 -->
<script>
(function () {
  try {
    var q = new URLSearchParams(location.search).get("theme");
    var mode = (q === "light" || q === "dark") ? q
             : (localStorage.getItem("edwards-site-theme") || "system");
    var resolved = mode === "system"
      ? ((window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark")
      : mode;
    document.documentElement.setAttribute("data-theme", resolved);
  } catch (e) {}
})();
</script>
